# 漢字ナレッジ自動更新ワークフロー
# 毎週日曜日 AM 3:00 (JST) に実行

name: Scrape Kanji Data

on:
  schedule:
    # 毎週日曜日 18:00 UTC (= 翌月曜日 03:00 JST)
    - cron: '0 18 * * 0'
  workflow_dispatch:
    # 手動実行も可能

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scrape scripts
        run: npm run scrape:all

      - name: Run QA check
        run: npm run scrape:qa

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "chore: auto-update kanji master data [skip ci]"
          git push

      - name: Notify success
        if: success()
        run: |
          echo "✅ Kanji data scrape completed successfully!"
          echo "📊 Files updated:"
          ls -la data/kanji_*.json

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Kanji data scrape failed!"
          exit 1


















